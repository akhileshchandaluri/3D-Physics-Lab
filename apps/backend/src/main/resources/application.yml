server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: physim-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/physim_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: PhysimHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    cookie-name: physim_session
    cookie-secret: ${SESSION_SECRET:physim_super_secret_cookie_signing_key_32chars!}
    session-ttl-days: ${SESSION_TTL_DAYS:30}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:admin@physim.edu}
    initial-password: ${INITIAL_ADMIN_PASSWORD:AdminPassword123!}
    initial-name: ${INITIAL_ADMIN_NAME:System Administrator}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback}
      allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:http://localhost:5173/oauth/callback,http://localhost:5174/oauth/callback,http://127.0.0.1:5173/oauth/callback,http://127.0.0.1:5174/oauth/callback}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.physim: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
